<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
  html,body { margin:0; background:#5c6361; }
  .row { display:flex; gap:28px; align-items:flex-end; padding:28px; }
  figure { margin:0; color:#fff; font:11px Liberation Sans, sans-serif; }
  img { background:#F3F4F1; display:block; border:0; }
  .px { image-rendering: pixelated; }
</style></head>
<body>
<div class="row">
  <figure><img src="file:///workspace/public/favicon.svg" width="16" height="16"><figcaption>16</figcaption></figure>
  <figure><img class="px" src="file:///workspace/public/favicon.svg" width="16" height="16" style="width:128px;height:128px"><figcaption>16 ×8</figcaption></figure>
  <figure><img src="file:///workspace/public/favicon.svg" width="32" height="32"><figcaption>32</figcaption></figure>
  <figure><img src="file:///workspace/public/favicon.svg" width="180" height="180"><figcaption>180</figcaption></figure>
</div>
</body></html>
